# Tether OS Configuration File
# Located at: /etc/tether.conf (Unix) or C:\TetherOS\etc\tether.conf (Windows)

[tether]
version = "1.1.2"
author = "Trapzzy"
rotation_interval = 60  # seconds (default: 60)
auto_rotate = true

[tor]
host = "127.0.0.1"
socks_port = 9050
control_port = 9051
password = ""  # set if you configured HashedControlPassword in torrc
cookie_path = "/run/tor/control.authcookie"

[proxy]
enabled = true
http_proxy = "127.0.0.1:8118"
socks_proxy = "127.0.0.1:9050"

[logging]
level = "INFO"
file = "~/.tether/tether.log"

[network]
kill_switch = false  # block all non-Tor traffic when enabled
dns_leak_protection = true
